# Convenience compose for the runner image — useful if you want to run
# reproduce/fuzz tasks from Claude Code on Windows while the JDK + Jazzer
# live in a container. `claude` itself stays on the host.
version: "3.8"
services:
  runner:
    build:
      context: ..
      dockerfile: docker/Dockerfile.runner
    image: claude-java-vuln-hunter-runner:latest
    container_name: cjvh-runner
    working_dir: /app
    # mount the host workspace so blobs/state are shared
    volumes:
      - ../workspace:/app/workspace
    # idle indefinitely — `reproduce.py --backend docker` does `docker run` per call
    command: ["bash", "-lc", "tail -f /dev/null"]
    init: true
